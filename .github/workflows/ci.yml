name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  agents-and-api:
    name: Lint, tests and offline evals
    runs-on: ubuntu-latest
    env:
      VIVA_OFFLINE: "1"  # scripted agents: no API keys, no cost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check agents backend tests
      - name: Unit and API tests
        run: pytest -q
      - name: Offline evals (edge cases, mixed student, 3,000-file repo)
        run: |
          python -m agents.eval edge
          python -m agents.eval mixed
          python -m agents.eval large

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t viva-panel .
      - name: Smoke test
        run: |
          docker run -d --name viva -p 8000:8000 -e VIVA_OFFLINE=1 viva-panel
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/health | grep -q '"status":"ok"'
          curl -sf localhost:8000/ | grep -q '<div id="root">'
