# Render blueprint: New > Blueprint > pick this repo. Secrets are asked for on first deploy.
services:
  - type: web
    name: viva-panel
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: VIVA_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: E2B_API_KEY       # test sandbox for real repos (Render can't run Docker)
        sync: false
      - key: VIVA_DAILY_SESSIONS
        value: "40"
      - key: VIVA_DAILY_PER_VISITOR   # one visitor can't use up the day's quota
        value: "6"
      - key: DATABASE_URL             # free Neon/Supabase Postgres: reports survive restarts (empty = SQLite)
        sync: false
